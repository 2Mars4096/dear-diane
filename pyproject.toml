[project]
name = "dan"
version = "0.2.0"
description = "Deep Agent Network — typed graph orchestration for multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[project.scripts]
dan-serve = "dan.server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
