[project]
name = "dan"
version = "0.1.0"
description = "Deep Agent Network — typed graph orchestration for multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
