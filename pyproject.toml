[project]
name = "dan"
version = "0.2.0"
description = "Deep Agent Network — typed graph orchestration for multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
]

[project.scripts]
dan-serve = "dan.server.__main__:main"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
search = ["duckduckgo-search>=6.0"]
all-tools = ["pypdf>=4.0", "duckduckgo-search>=6.0"]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.8"]
all-providers = ["anthropic>=0.40", "google-generativeai>=0.8"]
faiss = ["faiss-cpu>=1.7"]
chroma = ["chromadb>=0.5"]
embeddings = ["sentence-transformers>=3.0"]
jsonschema = ["jsonschema>=4.0"]
all-rag = ["faiss-cpu>=1.7", "chromadb>=0.5", "sentence-transformers>=3.0"]
all = [
    "pypdf>=4.0",
    "duckduckgo-search>=6.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "faiss-cpu>=1.7",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "jsonschema>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
