[project]
name = "dan"
version = "0.2.0"
description = "Dear Diane — A workspace for research, code, and ideas."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Dear Diane Contributors"}]
keywords = ["agents", "llm", "orchestration", "universal-cell", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/dan-project/dan"
Repository = "https://github.com/dan-project/dan"
Documentation = "https://github.com/dan-project/dan#readme"
Changelog = "https://github.com/dan-project/dan/blob/main/docs/changelog.md"
Issues = "https://github.com/dan-project/dan/issues"

[project.scripts]
dear-diane = "dan.cli.main:main"
dan = "dan.cli.main:main"
dan-serve = "dan.server.__main__:main"
dan-up = "dan.cli.up:main"
dan-down = "dan.cli.down:main"
dan-editor = "dan.cli.editor:main"
dan-super-organism = "dan.cli.super_organism:main"
dansuperorganism = "dan.cli.super_organism:main"
dan-super-tui = "dan.cli.super_tui:main"
dansupertui = "dan.cli.super_tui:main"

[project.optional-dependencies]
browser = ["playwright>=1.40"]
pdf = ["pypdf>=4.0", "pymupdf>=1.24"]
spreadsheet = ["openpyxl>=3.1"]
search = ["duckduckgo-search>=6.0"]
all-tools = ["pypdf>=4.0", "pymupdf>=1.24", "duckduckgo-search>=6.0", "openpyxl>=3.1"]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.8"]
all-providers = ["anthropic>=0.40", "google-generativeai>=0.8"]
jsonschema = ["jsonschema>=4.0"]
quant = ["pandas>=2.0", "matplotlib>=3.7"]
equity = ["yfinance>=0.2.40"]
cli = ["rich>=13.0", "prompt_toolkit>=3.0"]
all = [
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "duckduckgo-search>=6.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "jsonschema>=4.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]
addopts = "-m 'not integration and not quality_suite and not slow'"
markers = [
    "integration: tests that require a live LLM API key (deselect with -m 'not integration')",
    "quality_suite: generation quality suite tests (deselect with -m 'not quality_suite')",
    "slow: longer-running benchmark-style regressions (deselect with -m 'not slow')",
]
