[project]
name = "dan"
version = "0.1.1"
description = "Deep Agent Network — typed graph orchestration for multi-agent workflows"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "DAN Contributors"}]
keywords = ["agents", "llm", "orchestration", "workflow", "graph", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/dan-project/dan"
Repository = "https://github.com/dan-project/dan"
Documentation = "https://github.com/dan-project/dan#readme"
Changelog = "https://github.com/dan-project/dan/blob/main/docs/changelog.md"
Issues = "https://github.com/dan-project/dan/issues"

[project.scripts]
dan-serve = "dan.server.__main__:main"
dan-run = "dan.cli.run:main"
dan-status = "dan.cli.status:main"
dan-logs = "dan.cli.logs:main"
dan-publish = "dan.cli.publish:main"
dan-adapter = "dan.cli.adapter:main"
dan-blocks = "dan.cli.blocks:main"
dan-chat = "dan.cli.chat:main"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
search = ["duckduckgo-search>=6.0"]
all-tools = ["pypdf>=4.0", "duckduckgo-search>=6.0"]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.8"]
all-providers = ["anthropic>=0.40", "google-generativeai>=0.8"]
faiss = ["faiss-cpu>=1.7"]
chroma = ["chromadb>=0.5"]
embeddings = ["sentence-transformers>=3.0"]
jsonschema = ["jsonschema>=4.0"]
all-rag = ["faiss-cpu>=1.7", "chromadb>=0.5", "sentence-transformers>=3.0"]
quant = ["pandas>=2.0", "matplotlib>=3.7"]
cli = ["rich>=13.0"]
mcp = ["mcp>=1.0"]
messaging = [
    "python-telegram-bot>=21.0",
    "aiosmtplib>=3.0",
]
all = [
    "pypdf>=4.0",
    "duckduckgo-search>=6.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "faiss-cpu>=1.7",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "mcp>=1.0",
    "python-telegram-bot>=21.0",
    "aiosmtplib>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require a live LLM API key (deselect with -m 'not integration')",
]
