name: research_analyze_summarize_live
description: A 3-step chain workflow that researches a topic using live web search, analyzes findings, and summarizes results with grounded information
nodes:
  # STEP 1: Research - Search and fetch live information
  - id: web_search
    type: tool_operator
    config:
      tool: web_search
      params:
        query: "{{input.topic}}"
        num_results: 5
        fetch_content: true
    outputs:
      - search_results

  # STEP 2: Analyze - Process the fetched web content
  - id: analyze
    type: llm_operator
    config:
      model: kimi-k2.5
      system_prompt: You are an analytical expert. Analyze the provided web search results critically. Identify key facts, patterns, assess source credibility, and draw meaningful insights. Focus only on information present in the provided sources.
      prompt_template: |
        Analyze the following web search results about: {{input.topic}}

        SEARCH RESULTS:
        {{web_search.search_results}}

        Provide an analysis that includes:
        1. Key facts and data points extracted from the sources
        2. Main themes and patterns across sources
        3. Assessment of source credibility and potential biases
        4. Any contradictions or gaps in the information
        5. Critical insights based ONLY on the provided sources

        Be objective and cite which sources support each finding.
    inputs:
      - input.topic
      - web_search.search_results
    outputs:
      - analysis

  # STEP 3: Summarize - Create concise summary
  - id: summarize
    type: llm_operator
    config:
      model: kimi-k2.5
      system_prompt: You are a summarization expert. Create a clear, concise summary based on the analyzed web research. Ensure all claims are supported by the sources.
      prompt_template: |
        Based on the web research and analysis below, create a concise summary about: {{input.topic}}

        RESEARCH FINDINGS (from web sources):
        {{web_search.search_results}}

        ANALYSIS:
        {{analyze.analysis}}

        Provide a summary that includes:
        1. Main takeaways (2-4 key points) - cite sources
        2. Important context or background
        3. Any uncertainties or areas needing more research
        4. Conclusion (1-2 sentences)

        Keep it concise (200-300 words) and ensure all claims are grounded in the provided sources.
    inputs:
      - input.topic
      - web_search.search_results
      - analyze.analysis
    outputs:
      - summary

edges:
  - from: web_search
    to: analyze
  - from: analyze
    to: summarize

input_schema:
  type: object
  properties:
    topic:
      type: string
      description: The topic to research
  required:
    - topic

output_schema:
  type: object
  properties:
    search_results:
      type: string
      description: Raw web search results with fetched content
    analysis:
      type: string
      description: Critical analysis of web sources
    summary:
      type: string
      description: Concise grounded summary with citations
