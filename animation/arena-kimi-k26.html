<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Stick Battle: Cyber Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .health-bar-container {
            width: 30%;
            height: 30px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            transform: skewX(-20deg);
            position: relative;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .health-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .p1-health { background: linear-gradient(90deg, #ff0000, #ff4d4d); box-shadow: 0 0 15px #ff0000; transform-origin: left; }
        .p2-health { background: linear-gradient(90deg, #00ffff, #4dffff); box-shadow: 0 0 15px #00ffff; transform-origin: right; float: right;}

        .fighter-name {
            color: white;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px currentColor;
            margin-bottom: 5px;
            font-weight: 900;
        }

        .center-timer {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            font-weight: 900;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        .btn-neon {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-neon:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff, inset 0 0 20px #0ff;
        }

        .combo-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            color: #ff0;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Layer -->
    <canvas id="gameCanvas"></canvas>
    <div class="scanline"></div>

    <!-- UI Layer -->
    <div class="ui-layer">
        <div class="hud-top">
            <div style="width: 30%; text-align: left;">
                <div class="fighter-name" style="color: #ff4d4d;">RED STRIKER</div>
                <div class="health-bar-container">
                    <div id="p1Health" class="health-fill p1-health" style="width: 100%;"></div>
                </div>
            </div>
            
            <div class="center-timer" id="timer">60</div>

            <div style="width: 30%; text-align: right;">
                <div class="fighter-name" style="color: #4dffff;">CYAN BLADE</div>
                <div class="health-bar-container">
                    <div id="p2Health" class="health-fill p2-health" style="width: 100%; float: right;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Screen Overlay -->
    <div id="startScreen" class="start-screen">
        <h1 class="text-6xl font-black text-white mb-2 tracking-tighter" style="text-shadow: 0 0 30px #0ff;">NEON BRAWL</h1>
        <p class="text-gray-400 mb-8 text-xl">Procedural Stick Figure Combat Simulation</p>
        
        <div class="grid grid-cols-2 gap-8 mb-8 text-white text-sm border border-gray-700 p-6 rounded bg-black bg-opacity-50">
            <div>
                <h3 class="text-red-400 font-bold mb-2">PLAYER 1 (Red)</h3>
                <p>A / D : Move</p>
                <p>W : Jump</p>
                <p>S : Block</p>
                <p>SPACE : Attack</p>
            </div>
            <div>
                <h3 class="text-cyan-400 font-bold mb-2">PLAYER 2 (Cyan)</h3>
                <p>← / → : Move</p>
                <p>↑ : Jump</p>
                <p>↓ : Block</p>
                <p>ENTER : Attack</p>
            </div>
        </div>

        <button id="startBtn" class="btn-neon">Initialize Combat</button>
    </div>

    <script>
        /**
         * NEON BRAWL - Interactive Stick Figure Combat
         * Uses HTML5 Canvas for rendering and Tone.js for generative audio.
         */

        // --- Configuration & Constants ---
        const CONFIG = {
            gravity: 0.6,
            friction: 0.85,
            groundY: 0, // Set dynamically
            moveSpeed: 1.5,
            jumpForce: -14,
            attackRange: 60,
            attackDamage: 10,
            colors: {
                p1: '#ff3333',
                p2: '#00ffff',
                ground: '#1a1a1a',
                grid: '#333333'
            }
        };

        // --- Audio System (Tone.js) ---
        const AudioSys = {
            synth: null,
            noise: null,
            metal: null,
            bgm: null,
            isInit: false,

            init: async () => {
                if (AudioSys.isInit) return;
                await Tone.start();
                
                // Synth for hits
                AudioSys.synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();
                AudioSys.synth.volume.value = -5;

                // Noise for swooshes
                AudioSys.noise = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0 }
                }).toDestination();
                AudioSys.noise.volume.value = -10;

                // Metal synth for blocks
                AudioSys.metal = new Tone.MetalSynth({
                    frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
                    harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
                }).toDestination();
                AudioSys.metal.volume.value = -10;

                // BGM Loop
                const bass = new Tone.MembraneSynth().toDestination();
                const loop = new Tone.Loop(time => {
                    bass.triggerAttackRelease("C1", "8n", time);
                    bass.triggerAttackRelease("C1", "8n", time + 0.5);
                }, "1n").start(0);
                
                Tone.Transport.bpm.value = 110;
                AudioSys.isInit = true;
            },

            playHit: () => {
                if(!AudioSys.isInit) return;
                const notes = ["C2", "D2", "G1"];
                const note = notes[Math.floor(Math.random() * notes.length)];
                AudioSys.synth.triggerAttackRelease(note, "16n");
            },

            playSwoosh: () => {
                if(!AudioSys.isInit) return;
                AudioSys.noise.triggerAttackRelease("32n");
            },

            playBlock: () => {
                if(!AudioSys.isInit) return;
                AudioSys.metal.triggerAttackRelease("32n");
            },

            startMusic: () => {
                if(AudioSys.isInit) Tone.Transport.start();
            }
        };

        // --- Particle System ---
        class Particle {
            constructor(x, y, color, type = 'spark') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                if (type === 'blood') {
                    this.vy = (Math.random() * -5) - 2; // Upward spray
                    this.vx = (Math.random() - 0.5) * 10;
                    this.decay = 0.02;
                    this.gravity = 0.5;
                } else {
                    this.gravity = 0;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                if (this.type === 'blood') {
                    this.vy += this.gravity;
                } else {
                    this.vx *= 0.95; // Friction for sparks
                    this.vy *= 0.95;
                }
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'spark') {
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                } else {
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- Stick Figure Logic ---
        class StickFigure {
            constructor(x, color, controls, isPlayer1) {
                this.x = x;
                this.y = CONFIG.groundY;
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.controls = controls;
                this.isPlayer1 = isPlayer1;
                
                // State
                this.width = 40;
                this.height = 100;
                this.facing = isPlayer1 ? 1 : -1; // 1 right, -1 left
                this.state = 'idle'; // idle, run, jump, attack, block, hit
                this.animTimer = 0;
                
                // Combat
                this.hp = 100;
                this.maxHp = 100;
                this.isAttacking = false;
                this.isBlocking = false;
                this.isHit = false;
                this.attackCooldown = 0;
                this.hitStun = 0;
                
                // Visuals
                this.trail = []; // For afterimages
            }

            update(input, opponent) {
                // Hitstun logic
                if (this.hitStun > 0) {
                    this.hitStun--;
                    this.vx *= 0.8;
                    this.applyPhysics();
                    return;
                }

                // Reset states
                this.isAttacking = false;
                this.isBlocking = false;
                let moving = false;

                // Input Handling
                if (input[this.controls.left]) {
                    this.vx -= CONFIG.moveSpeed;
                    this.facing = -1;
                    moving = true;
                }
                if (input[this.controls.right]) {
                    this.vx += CONFIG.moveSpeed;
                    this.facing = 1;
                    moving = true;
                }
                if (input[this.controls.jump] && this.y >= CONFIG.groundY) {
                    this.vy = CONFIG.jumpForce;
                }
                if (input[this.controls.block]) {
                    this.isBlocking = true;
                    this.vx *= 0.5; // Slow down when blocking
                }
                if (input[this.controls.attack] && this.attackCooldown === 0) {
                    this.attack(opponent);
                }

                // State Machine
                if (this.y < CONFIG.groundY) this.state = 'jump';
                else if (this.isBlocking) this.state = 'block';
                else if (this.isAttacking) this.state = 'attack';
                else if (moving) this.state = 'run';
                else this.state = 'idle';

                // Cooldowns
                if (this.attackCooldown > 0) this.attackCooldown--;

                this.applyPhysics();
                this.checkBounds();
                this.updateTrail();
            }

            applyPhysics() {
                this.vy += CONFIG.gravity;
                this.x += this.vx;
                this.y += this.vy;

                // Friction
                this.vx *= CONFIG.friction;

                // Ground Collision
                if (this.y > CONFIG.groundY) {
                    this.y = CONFIG.groundY;
                    this.vy = 0;
                }
            }

            checkBounds() {
                if (this.x < 20) this.x = 20;
                if (this.x > canvas.width - 20) this.x = canvas.width - 20;
            }

            updateTrail() {
                if (Math.abs(this.vx) > 3 || Math.abs(this.vy) > 2) {
                    this.trail.push({x: this.x, y: this.y, alpha: 0.5});
                }
                if (this.trail.length > 5) this.trail.shift();
                this.trail.forEach(t => t.alpha -= 0.1);
            }

            attack(opponent) {
                this.isAttacking = true;
                this.attackCooldown = 20; // Frames
                
                // Check distance
                const dist = Math.abs(this.x - opponent.x);
                const facingOpponent = (this.facing === 1 && opponent.x > this.x) || (this.facing === -1 && opponent.x < this.x);

                AudioSys.playSwoosh();

                if (dist < CONFIG.attackRange && facingOpponent) {
                    if (opponent.isBlocking) {
                        // Blocked
                        createParticles((this.x + opponent.x)/2, this.y - 50, '#ffffff', 5, 'spark');
                        AudioSys.playBlock();
                        // Pushback
                        opponent.vx = this.facing * 5;
                        this.vx = -this.facing * 2;
                    } else {
                        // Hit
                        opponent.takeDamage(CONFIG.attackDamage);
                        opponent.vx = this.facing * 15; // Knockback
                        opponent.hitStun = 15;
                        createParticles(opponent.x, opponent.y - 50, opponent.color, 15, 'blood');
                        AudioSys.playHit();
                        screenShake = 10;
                        
                        // Combo Text
                        showComboText(opponent.x, opponent.y - 100);
                    }
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp < 0) this.hp = 0;
                updateHealthUI();
            }

            draw(ctx) {
                // Draw Trail
                this.trail.forEach(t => {
                    ctx.globalAlpha = t.alpha * 0.3;
                    this.drawBody(ctx, t.x, t.y, true);
                });
                ctx.globalAlpha = 1;

                this.drawBody(ctx, this.x, this.y, false);
            }

            drawBody(ctx, x, y, isGhost) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(this.facing, 1); // Flip based on facing

                // Style
                ctx.strokeStyle = isGhost ? this.color : this.color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                // Animation Offsets
                let armAngle = 0;
                let legOffset = 0;
                let bodyY = 0;

                if (this.state === 'run') {
                    legOffset = Math.sin(Date.now() / 50) * 10;
                    armAngle = Math.sin(Date.now() / 50) * 0.5;
                } else if (this.state === 'attack') {
                    armAngle = -2.5; // Swing arm up
                } else if (this.state === 'block') {
                    armAngle = -1; // Guard face
                } else if (this.state === 'hit') {
                    bodyY = 10;
                    ctx.rotate(0.2); // Tilt back
                } else if (this.state === 'jump') {
                    legOffset = 10;
                    armAngle = 0.5;
                }

                // --- Draw Limbs ---
                
                // Legs (Static relative to body for simplicity, animated via translation)
                ctx.beginPath();
                // Left Leg
                ctx.moveTo(0, -40); // Hip
                ctx.lineTo(-10 + legOffset, 0); // Foot
                // Right Leg
                ctx.moveTo(0, -40); // Hip
                ctx.lineTo(10 - legOffset, 0); // Foot
                ctx.stroke();

                // Torso
                ctx.beginPath();
                ctx.moveTo(0, -40); // Hip
                ctx.lineTo(0, -90 + bodyY); // Neck
                ctx.stroke();

                // Head
                ctx.fillStyle = '#000'; // Hollow head
                ctx.beginPath();
                ctx.arc(0, -105 + bodyY, 12, 0, Math.PI * 2);
                ctx.stroke();
                // Eyes (Angry)
                ctx.beginPath();
                ctx.moveTo(5, -108 + bodyY);
                ctx.lineTo(10, -103 + bodyY);
                ctx.moveTo(10, -108 + bodyY);
                ctx.lineTo(5, -103 + bodyY);
                ctx.stroke();

                // Arms
                ctx.beginPath();
                ctx.moveTo(0, -85 + bodyY); // Shoulder
                
                // Arm logic
                let handX = 20;
                let handY = -50 + bodyY;

                if (this.state === 'attack') {
                    // Swinging arc
                    handX = 40;
                    handY = -90 + bodyY;
                    // Draw Weapon/Effect
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(0, -85 + bodyY);
                    ctx.lineTo(50, -100 + bodyY); // Sword tip
                    ctx.stroke();
                    ctx.strokeStyle = this.color; // Reset
                } else if (this.state === 'block') {
                    handX = 15;
                    handY = -100 + bodyY;
                }

                ctx.lineTo(handX, handY);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- Global Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let screenShake = 0;
        let gameActive = false;
        let timer = 60;
        let lastTime = 0;

        // Input State
        const keys = {};

        // Players
        let p1, p2;

        // --- Initialization ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            CONFIG.groundY = canvas.height - 100;
            if(p1) p1.y = CONFIG.groundY; // Reset ground pos
            if(p2) p2.y = CONFIG.groundY;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            p1 = new StickFigure(canvas.width * 0.3, CONFIG.colors.p1, {
                left: 'a', right: 'd', jump: 'w', block: 's', attack: ' '
            }, true);
            
            p2 = new StickFigure(canvas.width * 0.7, CONFIG.colors.p2, {
                left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', block: 'ArrowDown', attack: 'Enter'
            }, false);

            particles = [];
            screenShake = 0;
            gameActive = true;
            timer = 60;
            
            updateHealthUI();
            AudioSys.startMusic();
            
            // Countdown
            let count = 3;
            const countDiv = document.createElement('div');
            countDiv.className = 'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-9xl font-black text-white z-50';
            document.body.appendChild(countDiv);
            
            const interval = setInterval(() => {
                countDiv.innerText = count > 0 ? count : "FIGHT!";
                countDiv.style.transform = "translate(-50%, -50%) scale(1.5)";
                setTimeout(() => countDiv.style.transform = "translate(-50%, -50%) scale(1)", 100);
                
                if(count === 0) {
                    clearInterval(interval);
                    setTimeout(() => countDiv.remove(), 1000);
                }
                count--;
            }, 800);

            requestAnimationFrame(gameLoop);
            
            // Timer Logic
            const timerInterval = setInterval(() => {
                if(!gameActive) { clearInterval(timerInterval); return; }
                timer--;
                document.getElementById('timer').innerText = timer;
                if(timer <= 0) endGame("TIME UP");
            }, 1000);
        }

        // --- Main Loop ---
        function gameLoop(timestamp) {
            if (!gameActive) return;

            // Clear
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Screen Shake
            ctx.save();
            if (screenShake > 0) {
                const dx = (Math.random() - 0.5) * screenShake;
                const dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.9;
                if(screenShake < 0.5) screenShake = 0;
            }

            // Draw Background Grid
            drawGrid();

            // Update & Draw Players
            p1.update(keys, p2);
            p2.update(keys, p1);

            // Check Death
            if (p1.hp <= 0) endGame("CYAN WINS");
            if (p2.hp <= 0) endGame("RED WINS");

            p1.draw(ctx);
            p2.draw(ctx);

            // Particles
            updateParticles();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const offset = (Date.now() / 50) % gridSize;
            
            // Vertical lines
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // Horizontal lines (Perspective effect)
            for (let y = CONFIG.groundY; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Horizon Glow
            const grad = ctx.createLinearGradient(0, CONFIG.groundY - 100, 0, CONFIG.groundY);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0, 255, 255, 0.2)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, CONFIG.groundY - 100, canvas.width, 100);
        }

        function createParticles(x, y, color, count, type) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, type));
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function showComboText(x, y) {
            const el = document.createElement('div');
            el.className = 'combo-text';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerText = "HIT!";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function updateHealthUI() {
            const h1 = document.getElementById('p1Health');
            const h2 = document.getElementById('p2Health');
            h1.style.width = (p1.hp / p1.maxHp * 100) + '%';
            h2.style.width = (p2.hp / p2.maxHp * 100) + '%';
        }

        function endGame(winnerText) {
            gameActive = false;
            const overlay = document.createElement('div');
            overlay.className = 'start-screen';
            overlay.innerHTML = `
                <h1 class="text-6xl font-black text-white mb-4" style="text-shadow: 0 0 30px #fff;">${winnerText}</h1>
                <button onclick="location.reload()" class="btn-neon">REBOOT SYSTEM</button>
            `;
            document.body.appendChild(overlay);
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        document.getElementById('startBtn').addEventListener('click', async () => {
            await AudioSys.init();
            document.getElementById('startScreen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('startScreen').style.display = 'none';
                initGame();
            }, 500);
        });
