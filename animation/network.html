<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Agent Network Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070a;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="netCanvas"></canvas>
<script>
const canvas = document.getElementById('netCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const NODE_COUNT = 24;
const nodes = [];
for (let i = 0; i < NODE_COUNT; i++) {
  nodes.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    r: 3 + Math.random() * 3,
    pulse: Math.random() * Math.PI * 2,
    label: 'A-' + i
  });
}

const edges = [];
for (let i = 0; i < nodes.length; i++) {
  for (let j = i + 1; j < nodes.length; j++) {
    const dx = nodes[i].x - nodes[j].x;
    const dy = nodes[i].y - nodes[j].y;
    if (dx * dx + dy * dy < 220 * 220) {
      edges.push({ a: i, b: j, packets: [] });
    }
  }
}

function spawnPacket(edge) {
  edge.packets.push({
    t: 0,
    speed: 0.005 + Math.random() * 0.01,
    size: 1.5 + Math.random() * 1.5,
    hue: 200 + Math.random() * 60
  });
}

edges.forEach(e => {
  if (Math.random() < 0.4) spawnPacket(e);
});

let time = 0;
function animate() {
  time++;
  ctx.fillStyle = 'rgba(5, 7, 10, 0.25)';
  ctx.fillRect(0, 0, W, H);

  // edges
  for (const e of edges) {
    const a = nodes[e.a];
    const b = nodes[e.b];
    ctx.strokeStyle = 'rgba(80, 120, 180, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // packets
    for (let i = e.packets.length - 1; i >= 0; i--) {
      const p = e.packets[i];
      p.t += p.speed;
      if (p.t >= 1) {
        e.packets.splice(i, 1);
        if (Math.random() < 0.3) spawnPacket(e);
        continue;
      }
      const px = a.x + (b.x - a.x) * p.t;
      const py = a.y + (b.y - a.y) * p.t;
      ctx.save();
      ctx.globalAlpha = 0.7 * (1 - Math.abs(p.t - 0.5) * 2);
      ctx.fillStyle = `hsl(${p.hue}, 80%, 65%)`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = `hsl(${p.hue}, 80%, 50%)`;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (e.packets.length === 0 && Math.random() < 0.005) spawnPacket(e);
  }

  // nodes
  for (const n of nodes) {
    n.x += n.vx;
    n.y += n.vy;
    if (n.x < 40) n.vx += 0.02;
    if (n.x > W - 40) n.vx -= 0.02;
    if (n.y < 40) n.vy += 0.02;
    if (n.y > H - 40) n.vy -= 0.02;

    n.pulse += 0.03;
    const glow = 0.6 + Math.sin(n.pulse) * 0.4;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = `rgba(100, 180, 255, ${glow})`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(60, 140, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
