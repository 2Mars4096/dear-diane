<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Burning in the Dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020202;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    display: block;
    box-shadow: 0 0 60px rgba(255, 100, 20, 0.05);
  }
</style>
</head>
<body>
<canvas id="matchCanvas"></canvas>
<script>
const canvas = document.getElementById('matchCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2 + 100;
const matchWidth = 14;
const matchHeight = 320;
const headRadius = 18;

let burnProgress = 0; // 0 to 1
let burnSpeed = 0.0008;
let time = 0;
let flameIntensity = 0;
let isIgniting = true;
let isExtinguished = false;
let extinguishTimer = 0;

const particles = [];
const sparks = [];
const smokes = [];

class FlameParticle {
  constructor(x, y, layer) {
    this.x = x + (Math.random() - 0.5) * 12;
    this.y = y;
    this.layer = layer;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -Math.random() * 3 - 1;
    this.life = 1;
    this.decay = Math.random() * 0.015 + 0.008;
    this.size = Math.random() * 8 + 4;
    if (layer === 'core') {
      this.size = Math.random() * 6 + 3;
      this.decay = Math.random() * 0.02 + 0.015;
      this.vy *= 0.7;
    } else if (layer === 'tip') {
      this.size = Math.random() * 14 + 6;
      this.decay = Math.random() * 0.012 + 0.006;
    }
  }
  update() {
    this.x += this.vx + Math.sin(time * 0.1 + this.y * 0.05) * 0.3;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 0.985;
    this.vx *= 0.98;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life * 0.8;
    if (this.layer === 'core') {
      ctx.fillStyle = `rgba(255, 255, 240, ${this.life})`;
    } else if (this.layer === 'body') {
      const r = 255;
      const g = Math.floor(180 + 60 * this.life);
      const b = Math.floor(40 * this.life);
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.life})`;
    } else {
      const r = 255;
      const g = Math.floor(80 + 100 * this.life);
      const b = 0;
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.life * 0.6})`;
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Spark {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = -Math.random() * 5 - 2;
    this.life = 1;
    this.decay = Math.random() * 0.03 + 0.02;
    this.size = Math.random() * 2 + 0.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08;
    this.life -= this.decay;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff5c2';
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#ffaa33';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Smoke {
  constructor(x, y) {
    this.x = x + (Math.random() - 0.5) * 10;
    this.y = y + (Math.random() - 0.5) * 6;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -Math.random() * 1.2 - 0.4;
    this.life = 1;
    this.decay = Math.random() * 0.0018 + 0.0012;
    this.size = Math.random() * 3 + 2;
    this.maxSize = this.size + Math.random() * 18 + 10;
    this.angle = Math.random() * Math.PI * 2;
    this.spin = (Math.random() - 0.5) * 0.03;
    this.turbulenceOffset = Math.random() * 100;
    this.warmth = Math.random();
  }
  update() {
    this.angle += this.spin;
    const t = time * 0.02 + this.turbulenceOffset;
    this.vx += Math.sin(t + this.y * 0.04) * 0.018 + Math.cos(t * 1.3) * 0.008;
    this.vy += Math.sin(t * 0.7) * 0.005;
    this.x += this.vx + Math.sin(t * 0.6 + this.y * 0.03) * 0.5;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.size < this.maxSize) this.size += 0.08;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.globalCompositeOperation = 'screen';
    const a = this.life * (0.14 + this.warmth * 0.06);
    const r = this.size;
    const stretch = 0.5 + this.life * 0.3;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    if (this.warmth > 0.6) {
      g.addColorStop(0, `rgba(160,150,130,${a})`);
      g.addColorStop(0.35, `rgba(110,100,90,${a * 0.65})`);
      g.addColorStop(0.75, `rgba(70,65,60,${a * 0.25})`);
      g.addColorStop(1, `rgba(40,38,36,0)`);
    } else if (this.warmth > 0.3) {
      g.addColorStop(0, `rgba(140,142,145,${a})`);
      g.addColorStop(0.35, `rgba(95,98,100,${a * 0.6})`);
      g.addColorStop(0.75, `rgba(60,62,64,${a * 0.22})`);
      g.addColorStop(1, `rgba(35,36,38,0)`);
    } else {
      g.addColorStop(0, `rgba(130,132,138,${a})`);
      g.addColorStop(0.35, `rgba(88,90,96,${a * 0.55})`);
      g.addColorStop(0.75, `rgba(55,57,62,${a * 0.2})`);
      g.addColorStop(1, `rgba(32,34,38,0)`);
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * stretch, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawMatchStick() {
  const burnY = centerY - matchHeight / 2 + burnProgress * matchHeight;
  
  // Glow around burning tip
  if (flameIntensity > 0.1 && !isExtinguished) {
    const glowRadius = 60 + flameIntensity * 100;
    const grad = ctx.createRadialGradient(centerX, burnY, 5, centerX, burnY, glowRadius);
    grad.addColorStop(0, `rgba(255, 160, 40, ${flameIntensity * 0.4})`);
    grad.addColorStop(0.3, `rgba(255, 80, 10, ${flameIntensity * 0.15})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(centerX - glowRadius, burnY - glowRadius, glowRadius * 2, glowRadius * 2);
  }

  // Match wood body
  ctx.save();
  const woodGrad = ctx.createLinearGradient(centerX - matchWidth / 2, 0, centerX + matchWidth / 2, 0);
  woodGrad.addColorStop(0, '#3a2510');
  woodGrad.addColorStop(0.2, '#5c3a1e');
  woodGrad.addColorStop(0.5, '#7a4f28');
  woodGrad.addColorStop(0.8, '#5c3a1e');
  woodGrad.addColorStop(1, '#2a1808');
  ctx.fillStyle = woodGrad;
  
  // Charred portion
  ctx.fillRect(centerX - matchWidth / 2, burnY, matchWidth, matchHeight - burnProgress * matchHeight);
  
  // Wood grain lines
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const gy = burnY + i * (matchHeight / 7) + 10;
    if (gy < centerY + matchHeight / 2) {
      ctx.beginPath();
      ctx.moveTo(centerX - matchWidth / 2 + 2, gy);
      ctx.lineTo(centerX + matchWidth / 2 - 2, gy + (Math.random() - 0.5) * 4);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Charred/burnt area at burn line
  if (burnProgress > 0) {
    const charHeight = 20 + burnProgress * 10;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(centerX - matchWidth / 2 - 1, burnY - 2, matchWidth + 2, charHeight);
    // Ember glow at burn line
    if (!isExtinguished) {
      ctx.fillStyle = `rgba(255, 80, 20, ${0.3 + 0.2 * Math.sin(time * 0.3)})`;
      ctx.fillRect(centerX - matchWidth / 2, burnY, matchWidth, 6);
    }
  }

  // Match head (only before burning through)
  if (burnProgress < 0.05) {
    ctx.save();
    const headGrad = ctx.createRadialGradient(centerX, centerY - matchHeight / 2 - 5, 2, centerX, centerY - matchHeight / 2 - 5, headRadius);
    headGrad.addColorStop(0, '#8b3a2a');
    headGrad.addColorStop(0.6, '#5c2018');
    headGrad.addColorStop(1, '#3a120c');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY - matchHeight / 2, headRadius, headRadius * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function spawnFlame(x, y, intensity) {
  const count = Math.floor(intensity * 4) + 2;
  for (let i = 0; i < count; i++) {
    const layer = Math.random() < 0.2 ? 'core' : (Math.random() < 0.5 ? 'body' : 'tip');
    particles.push(new FlameParticle(x, y, layer));
  }
  if (Math.random() < intensity * 0.4) {
    sparks.push(new Spark(x + (Math.random() - 0.5) * 10, y));
  }
  if (Math.random() < intensity * 0.3) {
    smokes.push(new Smoke(x, y - 20));
  }
}

function updateFlameIntensity() {
  if (isIgniting) {
    flameIntensity += 0.015;
    if (flameIntensity >= 1) {
      flameIntensity = 1;
      isIgniting = false;
    }
  } else if (isExtinguished) {
    flameIntensity *= 0.95;
    if (flameIntensity < 0.01) flameIntensity = 0;
  } else {
    // Natural flicker
    flameIntensity = 0.85 + Math.sin(time * 0.2) * 0.1 + Math.sin(time * 0.7) * 0.05;
  }
}

function animate() {
  time++;
  
  // Dark background with slight trail
  ctx.fillStyle = 'rgba(2, 2, 2, 0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Subtle ambient vignette
  const vig = ctx.createRadialGradient(centerX, centerY, 100, centerX, centerY, Math.max(canvas.width, canvas.height) * 0.7);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  updateFlameIntensity();

  // Burn progress
  if (!isExtinguished && !isIgniting) {
    burnProgress += burnSpeed;
    if (burnProgress >= 1) {
      burnProgress = 1;
      extinguishTimer++;
      if (extinguishTimer > 120) {
        isExtinguished = true;
      }
    }
  }

  const burnY = centerY - matchHeight / 2 + burnProgress * matchHeight;

  // Spawn flame at burn line
  if (!isExtinguished && flameIntensity > 0.1) {
    spawnFlame(centerX, burnY - 5, flameIntensity);
  }

  // Late-stage embers when nearly burnt out
  if (burnProgress > 0.85 && !isExtinguished) {
    if (Math.random() < 0.1) {
      sparks.push(new Spark(centerX + (Math.random() - 0.5) * 8, burnY));
    }
  }

  // Update and draw smoke (behind everything)
  for (let i = smokes.length - 1; i >= 0; i--) {
    smokes[i].update();
    smokes[i].draw(ctx);
    if (smokes[i].life <= 0) smokes.splice(i, 1);
  }

  // Draw match
  drawMatchStick();

  // Update and draw flame particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Update and draw sparks
  for (let i = sparks.length - 1; i >= 0; i--) {
    sparks[i].update();
    sparks[i].draw(ctx);
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }

  // Extinguished ember glow
  if (isExtinguished && burnProgress >= 0.95) {
    const emberAlpha = 0.3 + 0.15 * Math.sin(time * 0.05);
    ctx.save();
    ctx.globalAlpha = emberAlpha;
    ctx.fillStyle = '#ff4400';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff2200';
    ctx.beginPath();
    ctx.arc(centerX, centerY + matchHeight / 2 - 10, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Initial strike flash
  if (time < 20) {
    ctx.save();
    ctx.globalAlpha = (20 - time) / 20 * 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

animate();
</script>
</body>
</html>
