# 3-Step Chain Workflow: Research → Analyze → Summarize
# A simple sequential workflow for processing information through three stages

workflow:
  name: three_step_chain
  version: 1.0.0
  description: Research a topic, analyze findings, and produce a concise summary

  # Input schema
  inputs:
    topic:
      type: string
      description: The topic to research and summarize
      required: true
    research_depth:
      type: string
      description: Depth of research (brief|standard|comprehensive)
      default: standard
    output_format:
      type: string
      description: Format for the summary (bullet|paragraph|structured)
      default: structured

  # Output schema
  outputs:
    research_findings:
      type: string
      description: Raw research findings
    analysis:
      type: string
      description: Critical analysis of the findings
    summary:
      type: string
      description: Final concise summary

  # Node definitions
  nodes:
    # Step 1: Research
    research:
      type: llm_operator
      model: default
      prompt: |
        You are a research assistant. Research the following topic comprehensively.
        
        Topic: {{inputs.topic}}
        Depth: {{inputs.research_depth}}
        
        Provide detailed findings including:
        - Key facts and data points
        - Relevant context and background
        - Multiple perspectives if applicable
        - Sources or authoritative references where possible
        
        Be thorough and objective in your research.
      output:
        name: research_findings
        type: string

    # Step 2: Analyze
    analyze:
      type: llm_operator
      model: default
      depends_on: [research]
      prompt: |
        You are an analytical assistant. Analyze the following research findings.
        
        Research Findings:
        {{nodes.research.output.research_findings}}
        
        Provide a critical analysis that includes:
        - Key patterns and themes identified
        - Strengths and limitations of the information
        - Connections between different findings
        - Areas of uncertainty or gaps in knowledge
        - Strategic insights or implications
        
        Be analytical and insightful.
      output:
        name: analysis
        type: string

    # Step 3: Summarize
    summarize:
      type: llm_operator
      model: default
      depends_on: [analyze]
      prompt: |
        You are a summarization expert. Create a concise summary based on the research and analysis.
        
        Original Topic: {{inputs.topic}}
        Output Format: {{inputs.output_format}}
        
        Research Findings:
        {{nodes.research.output.research_findings}}
        
        Analysis:
        {{nodes.analyze.output.analysis}}
        
        Create a clear, concise summary that:
        - Captures the essence of the research
        - Highlights the most important insights
        - Is accessible to a general audience
        - Follows the requested format ({{inputs.output_format}})
        
        Format guidelines:
        - bullet: Use bullet points for key takeaways
        - paragraph: Write 1-2 cohesive paragraphs
        - structured: Use headers and organized sections
      output:
        name: summary
        type: string

  # Execution flow
  flow:
    start: research
    edges:
      - from: research
        to: analyze
      - from: analyze
        to: summarize
      - from: summarize
        to: end
